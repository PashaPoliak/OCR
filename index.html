<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Prep Sections</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #000000;
            color: #00ff00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background: #111111;
            border-radius: 20px;
            padding: 0px;
            box-shadow: 0 10px 40px rgba(0, 255, 0, 0.2);
            border: 1px solid #333;
            max-width: 100%;
            /* margin: 0 auto; */
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }
        .nav-tabs {
            border-bottom: 2px solid #00ff00;
            margin-bottom: 20px;
        }
        .nav-tabs .nav-link {
            background: #222222;
            color: #00ff00;
            border: 1px solid #444;
            border-radius: 10px 10px 0 0;
            margin-right: 5px;
            transition: all 0.3s ease;
        }
        .nav-tabs .nav-link:hover {
            background: #333333;
            color: #ffffff;
        }
        .nav-tabs .nav-link.active {
            background: #00ff00;
            color: #000000;
            border-color: #00ff00;
        }
        .tab-content {
            background: #111111;
            border-radius: 0 0 20px 20px;
            padding: 30px;
            border: 1px solid #333;
            border-top: none;
        }
        #justifications-content, #best-practices-content, #analyses-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .section-item {
            background: #222222;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            line-height: 1.6;
            border-left: 4px solid #00ff00;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            text-align: left;
            max-width: 50%;
        }
        #justifications-content .section-item, #best-practices-content .section-item, #analyses-content .section-item {
            flex: 1 1 calc(33.333% - 20px);
            max-width: calc(33.333% - 20px);
            margin-bottom: 0;
        }
        .section-item:hover {
            background: #333333;
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="justifications-tab" data-bs-toggle="tab" data-bs-target="#justifications" type="button" role="tab" aria-controls="justifications" aria-selected="true">Justifications</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="best-practices-tab" data-bs-toggle="tab" data-bs-target="#best-practices" type="button" role="tab" aria-controls="best-practices" aria-selected="false">Best Practices</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="analyses-tab" data-bs-toggle="tab" data-bs-target="#analyses" type="button" role="tab" aria-controls="analyses" aria-selected="false">Analyses</button>
            </li>
        </ul>
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="justifications" role="tabpanel" aria-labelledby="justifications-tab">
                <div id="justifications-content"></div>
            </div>
            <div class="tab-pane fade" id="best-practices" role="tabpanel" aria-labelledby="best-practices-tab">
                <div id="best-practices-content"></div>
            </div>
            <div class="tab-pane fade" id="analyses" role="tabpanel" aria-labelledby="analyses-tab">
                <div id="analyses-content"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="expl.js"></script>
    <script>
        function cleanMarkdown(text) {
            // Remove common markdown markers
            return text
                .replace(/\*\*/g, '')  // Bold
                .replace(/\*/g, '')    // Italics
                .replace(/^-\s*/gm, '') // Bullet points
                .replace(/^###\s*/gm, '') // Headers
                .replace(/^##\s*/gm, '') // Headers
                .replace(/^#\s*/gm, '') // Headers
                .trim();
        }

        function renderContent(array, containerId) {
            const container = document.getElementById(containerId);
            array.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'section-item';
                div.innerHTML = '<p>' + cleanMarkdown(item) + '</p>';
                container.appendChild(div);
            });
        }

        renderContent(justifications, 'justifications-content');
        renderContent(bestPractices, 'best-practices-content');
        renderContent(analyses, 'analyses-content');
    </script>
</body>
</html>
